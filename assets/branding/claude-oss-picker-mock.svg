<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none" role="img" aria-label="claude-oss picker mock">
  <title>CLAUDE-OSS · PICKER</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="720" rx="14"/></clipPath>
  </defs>

  <!-- window frame -->
  <rect width="1200" height="720" rx="14" fill="#0A0A0B"/>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="13.5" stroke="#F2F2F3" stroke-opacity="0.14"/>

  <g clip-path="url(#frame)">
    <!-- chrome -->
    <circle cx="28" cy="24" r="5" fill="#F2F2F3" fill-opacity="0.15"/>
    <circle cx="46" cy="24" r="5" fill="#F2F2F3" fill-opacity="0.15"/>
    <circle cx="64" cy="24" r="5" fill="#F2F2F3" fill-opacity="0.15"/>
    <text x="92" y="28" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#6E6E75">CLAUDE-OSS · PICKER</text>
    <g>
      <rect x="1056" y="12" width="120" height="24" rx="12" fill="#FF7A1A" fill-opacity="0.05" stroke="#FF7A1A" stroke-opacity="0.3"/>
      <circle cx="1072" cy="24" r="3" fill="#FF7A1A" fill-opacity="0.7"/>
      <text x="1082" y="28" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#FF7A1A" fill-opacity="0.7">BYPASS</text>
    </g>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#F2F2F3" stroke-opacity="0.08"/>

    <!-- ===== provider pane ===== -->
    <rect x="24" y="72" width="368" height="560" rx="10" fill="#0F0F11" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <text x="44" y="100" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75">PROVIDER</text>
    <text x="372" y="100" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75" fill-opacity="0.7">TYPE TO FILTER</text>
    <!-- filter line -->
    <text x="44" y="136" font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#FF7A1A" fill-opacity="0.6">&#10095;</text>
    <text x="62" y="136" font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#F2F2F3" fill-opacity="0.85">&#9608;</text>
    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="12">
      <text x="56" y="172" fill="#F2F2F3" fill-opacity="0.4">+ Add new provider</text>
      <text x="56" y="200" fill="#F2F2F3" fill-opacity="0.55">deepseek &#8212; DeepSeek</text>
      <!-- selected row: the ember -->
      <rect x="44" y="214" width="328" height="28" rx="6" fill="#FF7A1A" fill-opacity="0.12" stroke="#FF7A1A" stroke-opacity="0.55"/>
      <text x="56" y="233" fill="#FF7A1A">glm &#8212; Z.ai (GLM)</text>
      <text x="56" y="268" fill="#F2F2F3" fill-opacity="0.55">kimi &#8212; Moonshot (Kimi)</text>
      <text x="56" y="296" fill="#F2F2F3" fill-opacity="0.55">ollama &#8212; Ollama (local)</text>
    </g>
    <text x="44" y="608" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" fill="#6E6E75" fill-opacity="0.7">3/5 · &#8593;&#8595; move · enter select · esc cancel</text>

    <!-- ===== model pane ===== -->
    <rect x="416" y="72" width="368" height="560" rx="10" fill="#0F0F11" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <text x="436" y="100" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75">MODEL · 6 AVAILABLE</text>
    <text x="764" y="100" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75" fill-opacity="0.7">LIVE /V1/MODELS</text>
    <text x="436" y="136" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#6E6E75">:: Fetched 6 models live from /v1/models</text>
    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="12">
      <text x="448" y="172" fill="#F2F2F3" fill-opacity="0.4">+ Enter custom model id</text>
      <rect x="436" y="186" width="328" height="28" rx="6" fill="#FF7A1A" fill-opacity="0.06" stroke="#FF7A1A" stroke-opacity="0.3"/>
      <text x="448" y="205" fill="#FF7A1A" fill-opacity="0.7">glm-5.1</text>
      <text x="448" y="240" fill="#F2F2F3" fill-opacity="0.55">glm-5.1-air</text>
      <text x="448" y="268" fill="#F2F2F3" fill-opacity="0.55">glm-4.7</text>
      <text x="448" y="296" fill="#F2F2F3" fill-opacity="0.55">glm-4.7-air</text>
      <text x="448" y="324" fill="#F2F2F3" fill-opacity="0.55">glm-4.6</text>
      <text x="448" y="352" fill="#F2F2F3" fill-opacity="0.55">glm-4.6-air</text>
    </g>
    <text x="436" y="608" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" fill="#6E6E75" fill-opacity="0.7">2/7 · default preselected</text>

    <!-- ===== launch pane ===== -->
    <rect x="808" y="72" width="368" height="560" rx="10" fill="#0F0F11" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <text x="828" y="100" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75">LAUNCH</text>
    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="11">
      <text x="828" y="140" fill="#6E6E75">export ANTHROPIC_BASE_URL=</text>
      <text x="828" y="158" fill="#F2F2F3" fill-opacity="0.85">  https://api.z.ai/api/anthropic</text>
      <text x="828" y="190" fill="#6E6E75">export ANTHROPIC_MODEL=</text>
      <text x="828" y="208" fill="#F2F2F3" fill-opacity="0.85">  glm-5.1</text>
      <text x="828" y="240" fill="#6E6E75">export ANTHROPIC_SMALL_FAST_MODEL=</text>
      <text x="828" y="258" fill="#F2F2F3" fill-opacity="0.85">  glm-4.7-air</text>
      <text x="828" y="290" fill="#6E6E75">export ANTHROPIC_AUTH_TOKEN=</text>
      <text x="828" y="308" fill="#F2F2F3" fill-opacity="0.85">  $ZAI_API_KEY</text>
    </g>
    <line x1="828" y1="336" x2="1156" y2="336" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="12">
      <text x="828" y="372" fill="#F2F2F3" fill-opacity="0.85">exec claude</text>
      <text x="828" y="396" fill="#F2F2F3" fill-opacity="0.55">  --dangerously-skip-permissions</text>
      <text x="828" y="420" fill="#F2F2F3" fill-opacity="0.55">  ultracode</text>
    </g>
    <text x="828" y="608" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" fill="#6E6E75" fill-opacity="0.7">login + subscription untouched</text>

    <!-- command bar -->
    <rect x="24" y="656" width="1152" height="40" rx="10" fill="#0F0F11" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <text x="44" y="681" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#6E6E75">$</text>
    <text x="60" y="681" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#F2F2F3" fill-opacity="0.85">claude-oss</text>
  </g>
</svg>
