<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" fill="none" role="img" aria-label="claude-oss horizontal lockup">
  <title>claude-oss horizontal lockup</title>
  <rect width="720" height="180" rx="24" fill="#0A0A0B"/>
  <g transform="translate(40 50) scale(0.625)">
    <rect width="128" height="128" rx="24" fill="#0F0F11" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <!-- prompt chevron -->
    <path d="M32 44 L52 64 L32 84" stroke="#F2F2F3" stroke-width="4" stroke-linecap="square" fill="none"/>
    <!-- picker rows -->
    <g stroke-linecap="round">
      <line x1="66" y1="46" x2="96" y2="46" stroke="#F2F2F3" stroke-width="3" opacity="0.35"/>
      <line x1="66" y1="64" x2="96" y2="64" stroke="#F2F2F3" stroke-width="3" opacity="0.85"/>
      <line x1="66" y1="82" x2="96" y2="82" stroke="#F2F2F3" stroke-width="3" opacity="0.35"/>
    </g>
    <!-- ember: the selected row -->
    <circle cx="58" cy="64" r="6" fill="#FF7A1A"/>
  </g>
  <text x="160" y="106" fill="#F2F2F3" font-family="Geist, Inter, Arial, sans-serif" font-size="52" font-weight="750" letter-spacing="-0.02em">claude-oss</text>
  <text x="164" y="140" fill="#6E6E75" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="500" letter-spacing="0.18em">ANY PROVIDER · ONE PICKER · LAUNCH</text>
</svg>
